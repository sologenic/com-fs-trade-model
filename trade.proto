syntax = "proto3";

package trade;

option go_package = "github.com/sologenic/com-fs-trade-model;trade";

import "google/protobuf/timestamp.proto";
import "sologenic/com-fs-utils-lib/models/order-properties/order-properties.proto";
import "sologenic/com-fs-utils-lib/models/metadata/metadata.proto";
import "sologenic/com-fs-asset-model/domain/denom/denom.proto";
import "sologenic/com-fs-utils-lib/go/decimal/decimal.proto";
import "sologenic/com-fs-order-model/broker.proto";

// Key in store is TXID-Sequence-Metadata.Network
message Trade {
    string UserID = 1;
    string OrderKey = 2; // Datastore key: OrderID-SmartContractAddr-Network
    int64 Sequence = 3; // The sequence number of the order, assigned by the DEX (guaranteed unique value for the order)
    decimal.Decimal Amount = 4;
    double Price = 5;
    denom.Denom Denom1 = 6; // Base currency (e.g. suwusdc_1-smartContractAddr)
    denom.Denom Denom2 = 7; // Asset denom (e.g. suaapl_1-smartContractAddr)
    orderproperties.Side Side = 8;  // The buy/sell (e.g. did the user place a buy or sell order)
    google.protobuf.Timestamp BlockTime = 9; // The time the trade was executed in UTC
    string OrganizationID = 10;

    // Standard storage related fields
    metadata.MetaData MetaData = 30;
    optional string TXID = 31;
    int64 BlockHeight = 32;
    bool Enriched = 33; // If the trade has been enriched with precision data 
    bool Processed = 34; // Check if trade is processed into the OHLC

    // This status field enables unified indexing in Elasticsearch, allowing the backend to return a single combined dataset of both trades(executed orders) and orders for user trade history, 
    // eliminating the need for separate Trade and Order queries on the frontend. Therefore, this field is to be used only when creating indexes in Elasticsearch.
    optional Status Status = 35;

    // USD representation of the trade values and trading fee (fixed base for easy data comparisson in reports etc), applicable for non-WUSDC based trades, RWAs, etc.
    optional float USD = 40; // The USD value of the trade, calculated from the USD value of the currencies and the trading fee.

    // Trades get stored in alphabetical order of the denom pair. 
    // Data is "uninverted" on retrieval and 
    // this flag only indicates that the denoms as seen in the record are not in the original order
    bool Inverted = 50;

    order.TradeType TradeType = 51; // The type of the trade, e.g. limit, market, etc.
    optional decimal.Decimal Commission = 52; // The commission paid to the brokerage
}

message Trades {
    repeated Trade Trades = 1;
    optional int32 Offset = 2; // Offset for pagination
}

enum Status {
    NOT_USED_STATUS = 0;
    PARTIALLY_FILLED = 1;
    FILLED = 2;
    CANCELLED = 3;
    PLACED = 4;
    EXPIRED = 5;
    PENDING = 6;
}
