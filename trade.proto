syntax = "proto3";

package trade;

option go_package = "github.com/sologenic/com-fs-trade-model;trade";

import "google/protobuf/timestamp.proto";
import "sologenic/com-fs-utils-lib/models/order-properties/order-properties.proto";
import "sologenic/com-fs-utils-lib/models/metadata/metadata.proto";
import "sologenic/com-fs-asset-model/domain/denom/denom.proto";
import "sologenic/com-fs-utils-lib/go/decimal/decimal.proto";
import "sologenic/com-fs-order-model/broker.proto";
import "sologenic/com-fs-order-model/util.proto";

// Key in store is TXID-Sequence-Metadata.Network
message Trade { // Synonym for Transaction, which would have been a better name
    string UserID = 1;
    optional string OrderKey = 2; // Datastore key: OrderID-SmartContractAddr-Network
    int64 Sequence = 3; // The sequence number of the order, assigned by the DEX (guaranteed unique value for the order)
    decimal.Decimal Amount = 4; // Last fill quantity from the most recent fill/partial fill event
    double Price = 5; // Last fill price from the most recent fill/partial fill event
    denom.Denom Denom1 = 6; // Base currency (e.g. suwusdc_1-smartContractAddr)
    denom.Denom Denom2 = 7; // Asset denom (e.g. suaapl_1-smartContractAddr)
    orderproperties.Side Side = 8;  // The buy/sell (in the context of transactions, buys are inflow of funds and sells are outflow of funds)
    google.protobuf.Timestamp BlockTime = 9; // The time the trade was executed in UTC
    string OrganizationID = 10;
    optional Receiver Receiver = 11; // The address of the receiver, used for sending of funds. Receiver can also be an email address, tx address or blockchain addres from another blockchain.
    // Standard storage related fields
    metadata.MetaData MetaData = 30;
    optional string TXID = 31;
    int64 BlockHeight = 32;
    bool Enriched = 33; // If the trade has been enriched with precision data 
    bool Processed = 34; // Check if trade is processed into the OHLC

    // This status field enables unified indexing in Elasticsearch, allowing the backend to return a single combined dataset of both trades(executed orders) and orders for user trade history, 
    // eliminating the need for separate Trade and Order queries on the frontend. Therefore, this field is to be used only when creating indexes in Elasticsearch.
    optional Status Status = 35;

    // USD representation of the trade values and trading fee (fixed base for easy data comparisson in reports etc), applicable for non-WUSDC based trades, RWAs, etc.
    optional float USD = 40; // The USD value of the trade, calculated from the USD value of the currencies and the trading fee.

    optional order.TradeType TradeType = 41; // The type of the trade, e.g. limit, market, etc.
    optional double Commission = 42; // The commission paid to the brokerage
    optional order.TimeInForce TimeInForce = 43; // The time in force for the trade, e.g. GTC, IOC, FOK, etc.

    // Type of activity that the order represents, e.g. deposit, withdrawal, etc.
    // Since wallets hold tokenized assets, we can treat inflow activities (e.g. deposits, dividends, received) as "buys" and outflow activities (e.g. withdrawals, sent) as "sell"
    optional ActivityType ActivityType = 44;

    // Trades get stored in alphabetical order of the denom pair. 
    // Data is "uninverted" on retrieval and 
    // this flag only indicates that the denoms as seen in the record are not in the original order
    bool Inverted = 50;

    // Order request details - what the user originally requested when placing the order
    optional decimal.Decimal RequestedQty = 51;        // Original requested order quantity 
    optional double LimitPrice = 52;          // Limit price set by the user
    // Actual execution details - cumulative results across all fills
    optional decimal.Decimal FilledQty = 53;           // Total accumulated quantity filled
    optional double FilledAvgPrice = 54;               // Average execution price
}

enum ActivityType {
    NOT_USED_ACTIVITY_TYPE = 0;
    ORDER = 1; // Order related: buy, sell, cancel
    DEPOSIT = 2; // Deposit of funds to an account
    WITHDRAWAL = 3; // Withdrawal of funds from an account
    DIVIDEND = 4; // Dividend payment to an account
    INTEREST = 5; // Interest payment to an account
    RECEIVED = 6; // Received funds from another account
    SENT = 7; // Sent funds from this account to another account
    SUBSCRIPTION = 8; // Subscription to a service or product
    USDC_USD_CONVERSION = 9; // Conversion of USDC to USD for deposit/withdrawals
}

message Trades {
    repeated Trade Trades = 1;
    optional int32 Offset = 2; // Offset for pagination
}

message Receiver {
    string Address = 1; // The address of the receiver, used for sending of funds.
    ReceiverType Type = 2; // The type of the receiver, e.g. email, tx address, blockchain address from another blockchain.
}

enum ReceiverType {
    EMAIL = 0;
    TX = 1;
    ETHEREUM = 2;
    SOLANA = 3;
}

enum Status {
    NOT_USED_STATUS = 0;
    PARTIALLY_FILLED = 1;
    FILLED = 2;
    CANCELLED = 3;
    PLACED = 4;
    EXPIRED = 5;
    PENDING = 6;
}
