syntax = "proto3";

package trade;

option go_package = "github.com/sologenic/com-fs-trade-model;trade";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "trade.proto";

service TradeService {
    rpc Get(TradeKey) returns (Trade) {}
    // Upsert creates a trade once. Trades are immutable after create.
    // An identical retry succeeds. A different payload for the same key fails.
    rpc Upsert(Trade) returns (google.protobuf.Empty) {}
    rpc List(Filter) returns (Trades) {}
}

// Ability to get all trade history views using the filter options
message Filter {
    string OrganizationID = 10;
    optional google.protobuf.Timestamp From = 2;
    optional google.protobuf.Timestamp To = 3;
    optional string UserID = 11; // User ID for the trade
    optional string OrderID = 12; // Internal Order ID
    optional int32 Limit = 14;
}

message TradeKey {
    string ExecutionID = 1;
    string OrganizationID = 2;
}
